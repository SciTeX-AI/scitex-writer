name: CLA Assistant

# Calls the org-provided reusable instead of re-implementing it (PS-231).
#
# The reusable derives the repository and the CLA.md URL from
# `${{ github.repository }}`, which for a workflow_call run resolves to the
# CALLING repository — so nothing here needs to name scitex-writer.
#
# `owner_allowlist` IS passed: writer's list carries `LLEmacs` in addition to
# the org default `bot*,ywatanabe1989`. Dropping it would start demanding a CLA
# signature from a contributor who has been allowlisted here since this
# workflow was written.
#
# GH_PERSONAL_ACCESS_TOKEN is mapped EXPLICITLY rather than via
# `secrets: inherit` — inherit forwards every secret this repo holds into the
# reusable, and writer holds CLAUDE_CODE_CREDENTIALS_JSON, which the CLA action
# has no business seeing (PS-224).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAssistant:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

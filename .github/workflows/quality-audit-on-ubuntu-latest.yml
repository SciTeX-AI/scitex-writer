name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package (audit-cli / audit-mcp-tools / audit-skills /
# audit-python-apis / audit-project). Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# This gate runs the FULL audit. It does not carry `--new-only` or
# `--no-version-check`, deliberately — see the note above the run step.
#
# The previous body of this workflow shallow-cloned the entire ecosystem
# and ran `scripts/quality/audit_ecosystem.py` — both of which live only
# in scitex-dev, not in leaf packages. That template was copied here
# verbatim and was always broken (FileNotFoundError on a non-existent
# ecosystem registry file). This version audits just this package.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after Test
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/scitex-writer-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "scitex-dev[cli-audit]>=0.17.14"

      # NO --new-only, NO --since, NO --no-version-check, deliberately.
      #
      # --new-only reported only violations newer than a baseline ref, so
      # every pre-existing finding sat under it permanently: the gate stayed
      # green while the tree never got cleaner. --no-version-check removed the
      # guard that the auditor is the version this gate was written against,
      # so the gate could also grade itself with the wrong ruler and not say
      # so. Together they are the pair that yields a fast green on a tree with
      # unbounded findings.
      #
      # An exemption is a decision someone made and signed, per rule, in a
      # file a reviewer can read. --new-only was a decision nobody made:
      # nothing recorded WHICH findings it hid or WHY, and the hidden set
      # drifted silently as the baseline moved. The gate could not itself be
      # audited, which is a strange property for an audit gate.
      #
      # EXPECT RED until the pre-existing findings are worked off. This does
      # not introduce failures; it stops concealing them.
      - name: Run scitex-dev ecosystem audit-all
        run: scitex-dev ecosystem audit-all scitex-writer

name: audit

# Calls the org-provided reusable instead of re-implementing it (PS-231).
#
# THIS ALSO CLOSES A GATE THAT COULD NOT FAIL. The body replaced here ran
#
#     scitex-dev ecosystem audit-all scitex-writer --new-only \
#         --since "$AUDIT_BASE_REF" --no-version-check
#
# `--new-only` suppresses anything already present on the base ref, so
# pre-existing findings were grandfathered permanently and invisibly, and
# `--no-version-check` skipped the one check that would have said the rule
# corpus had moved. Constitution §2 names this configuration as the worked
# example. The org reusable audits the whole tree with neither flag, so this
# job now reports what is actually there.
#
# Deferrals, where a rule genuinely must wait, are declared one at a time with
# a written reason in .scitex/dev/config.yaml under `audit.skip-rules` — which
# both this job and tests/develop/test_audit.py read, and which prints a masked
# inventory in every run rather than hiding the count.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main

name: auto-merge-to-develop

# Calls the org-provided reusable instead of re-implementing it (PS-231).
#
# Merges green PRs that TARGET develop as soon as their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file must live on main even though it acts only on PRs based on
# develop.
#
# Every input is left at its default: the body replaced here did exactly what
# the reusable does — skip drafts, ignore advisory codecov/readthedocs checks,
# merge when nothing else is pending, and leave the PR open when branch policy
# blocks the merge.

on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

jobs:
  automerge:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    permissions:
      contents: write
      pull-requests: write

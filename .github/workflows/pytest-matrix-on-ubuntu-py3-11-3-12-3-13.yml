name: tests

# CANONICAL CALLER STUB — copied from scitex-ai/.github workflow-templates/.
#
# The job id `pytest-matrix` is NOT cosmetic. GitHub names the status check of
# a reusable-workflow call "<caller job id> / <job name inside the reusable>",
# so the job id below IS the branch-protection context prefix. With
# `pytest-matrix` every repo in the ecosystem emits exactly:
#
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.11
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.12
#     pytest-matrix / pytest-matrix-on-ubuntu-py3.13
#
# One required-status-check list then serves every repo. Renaming it would give
# this repo a bespoke protection list forever.
#
# NOTE FOR WHOEVER MERGES THIS: the contexts above REPLACE the unprefixed
# `pytest-matrix-on-ubuntu-py3.NN` names this repo required until now. Branch
# protection must be updated in the same operation or every PR blocks silently
# — that exact failure already cost this repo once (see CHANGELOG 2.41.0: the
# protection named contexts no check run ever produced, and merges needed
# --admin for weeks).
#
# NO `secrets:` BLOCK ON PURPOSE. The stub ships a CODECOV_TOKEN mapping and
# tells you to DELETE it unless the repo holds that secret. Measured
# 2026-08-18, scitex-writer holds CLAUDE_CODE_CREDENTIALS_JSON,
# GH_PERSONAL_ACCESS_TOKEN and PERSONAL_ACCESS_TOKEN — no CODECOV_TOKEN. An
# unset secret maps to empty and coverage upload then fails as "Token required
# because branch is protected" while the step still reports success.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly, off-peak
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:            # <-- DO NOT RENAME (see above)
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main

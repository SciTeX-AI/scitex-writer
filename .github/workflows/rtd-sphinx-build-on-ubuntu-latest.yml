name: docs

# Calls the org-provided reusable instead of re-implementing it (PS-231).
#
# This is the BUILD GATE only. The body replaced here did two unrelated jobs
# in one file: gate the Sphinx build, and vendor the built HTML into
# src/scitex_writer/_sphinx_html/. Only the first is what every repo does, so
# only the first belongs to the org workflow; the vendoring step moved to
# vendor-sphinx-html.yml, which is genuinely unique to this leaf.
#
# Splitting rather than claiming an exemption for the whole file is the point:
# an exemption would have kept the shared half local too, and a local copy does
# not track fixes made org-side.
#
# `docs_dir` is left at its default `docs/sphinx`, which is where writer's
# docs already live.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main

name: import-smoke

# Calls the org-provided reusable instead of re-implementing it (PS-231).
#
# Catches "wheel installs but `import scitex_writer` blows up at runtime" —
# separate from the full pytest suite so a broken entry point fails fast
# without paying for the matrix, and installed with NO extras so `[project]
# dependencies` drift cannot hide behind the matrix's `[all,dev]` install.
#
# `console_script` is left at its default: the reusable derives what to import
# from the distribution, and the body replaced here did exactly the same bare
# `pip install -e .` + `import scitex_writer` that the reusable does.
#
# NOT the same gate as `sdist-wheel-import`, which stays a leaf workflow: that
# one builds an sdist, builds a wheel FROM it, and installs into a clean venv
# — the only place a packaging exclude actually bites. This one installs from
# the source tree, so it cannot catch a broken sdist and does not try to.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
